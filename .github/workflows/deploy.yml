name: Deploy to GitHub Pages

# One Pages site, two builds:
#   main         -> https://<user>.github.io/<repo>/
#   design/bold  -> https://<user>.github.io/<repo>/bold/
# A push to either branch rebuilds both, so neither link goes stale.
on:
  push:
    branches: [main, design/bold]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main-src
      - uses: actions/checkout@v4
        with:
          ref: design/bold
          path: bold-src
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            main-src/package-lock.json
            bold-src/package-lock.json

      - name: Build main
        working-directory: main-src
        run: npm ci && npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

      - name: Build design/bold
        working-directory: bold-src
        run: npm ci && npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/bold/

      - name: Assemble site
        run: |
          mkdir -p site/bold
          cp -r main-src/dist/. site/
          cp -r bold-src/dist/. site/bold/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
