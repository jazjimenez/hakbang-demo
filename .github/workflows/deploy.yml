name: Deploy to GitHub Pages

# main -> https://<user>.github.io/<repo>/
# The old /bold/ and /polish/ previews are now part of main. Small redirect
# pages in public/bold and public/polish keep any shared links working.
# The presenter-story tests must pass before anything is published.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: test-results
          retention-days: 7

  build:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Build
        run: npm ci && npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

      - name: Link-preview image (og.png)
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: |
          npx playwright install --with-deps chromium
          npx vite preview --port 4175 --strictPort &
          sleep 3
          node scripts/og.mjs "http://localhost:4175/${{ github.event.repository.name }}/" dist/og.png

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
