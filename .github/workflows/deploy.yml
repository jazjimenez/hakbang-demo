name: Deploy to GitHub Pages

# One Pages site, three builds:
#   main         -> https://<user>.github.io/<repo>/
#   design/bold  -> https://<user>.github.io/<repo>/bold/
#   site-polish  -> https://<user>.github.io/<repo>/polish/  (review preview)
# A push to any of them rebuilds all, so no link goes stale.
# The presenter-story tests must pass before anything is published.
on:
  push:
    branches: [main, design/bold, site-polish]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: test-results
          retention-days: 7

  build:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          path: main-src
      - uses: actions/checkout@v7
        with:
          ref: design/bold
          path: bold-src
      - uses: actions/checkout@v7
        with:
          ref: site-polish
          path: polish-src
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            main-src/package-lock.json
            bold-src/package-lock.json
            polish-src/package-lock.json

      - name: Build main
        working-directory: main-src
        run: npm ci && npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

      - name: Build design/bold
        working-directory: bold-src
        run: npm ci && npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/bold/

      - name: Build site-polish
        working-directory: polish-src
        run: npm ci && npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/polish/

      - name: Assemble site
        run: |
          mkdir -p site/bold site/polish
          cp -r main-src/dist/. site/
          cp -r bold-src/dist/. site/bold/
          cp -r polish-src/dist/. site/polish/

      - name: Link-preview image (og.png) from the main build
        working-directory: main-src
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: |
          npx playwright install --with-deps chromium
          npx vite preview --port 4175 --strictPort &
          sleep 3
          node scripts/og.mjs "http://localhost:4175/${{ github.event.repository.name }}/" ../site/og.png
          cp ../site/og.png ../site/bold/og.png
          cp ../site/og.png ../site/polish/og.png

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
